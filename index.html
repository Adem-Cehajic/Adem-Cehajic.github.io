<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123c2d">
    <meta name="description" content="The portfolio of Adem Cehajic, computer engineering student and software developer.">
    <title>Adem Cehajic | Portfolio</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="portfolio">

      <section class="card-stage" aria-label="A row of five cards">
        <div class="card-wrap">
          <div class="card-control social-card-control" data-card-name="Social profiles" role="group" tabindex="0" aria-label="Social profiles card, press Enter or Space to turn">
            <span class="card-flipper">
              <span class="card-face card-front" aria-hidden="true">
                <img src="images/card.png" alt="">
              </span>
              <span class="card-face card-back social-card-back">
                <span class="social-card-title">Find me</span>
                <span class="social-card-links">
                  <a href="https://github.com/Adem-Cehajic" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
                    <img src="images/githubimagewhite-removebg-preview.png" alt="">
                  </a>
                  <a href="https://www.linkedin.com/in/ademcehajic/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
                    <img src="images/whitelinkedin-removebg-preview.png" alt="">
                  </a>
                </span>
              </span>
            </span>
          </div>
        </div>
        <div class="card-wrap">
          <button class="card-control" type="button" data-card-name="Nothing card" aria-label="Reveal Nothing card" aria-pressed="false">
            <span class="card-flipper">
              <span class="card-face card-front" aria-hidden="true">
                <img src="images/card.png" alt="">
              </span>
              <span class="card-face card-back card-back-empty">nothing</span>
            </span>
          </button>
        </div>
        <div class="card-wrap card-wrap-about">
          <button class="card-control" type="button" data-card-name="About Adem" aria-label="Reveal about Adem" aria-pressed="false">
            <span class="card-flipper">
              <span class="card-face card-front" aria-hidden="true">
                <img src="images/card.png" alt="">
              </span>
              <span class="card-face card-back">
                <span class="card-index">A · 01</span>
                <span class="card-heading">A little<br>about me<span>.</span></span>
                <span class="card-rule"></span>
                <span class="card-copy">Hello, I’m Adem, a computer engineering student at McMaster University. I enjoy solving problems, writing software, and building electronics.</span>
                <span class="card-interests">AI research <i>·</i> software <i>·</i> electronics</span>
                <span class="card-signoff">TURN TO EXPLORE <span>↗</span></span>
              </span>
            </span>
          </button>
        </div>
        <div class="card-wrap">
          <button class="card-control" type="button" data-card-name="Nothing card" aria-label="Reveal Nothing card" aria-pressed="false">
            <span class="card-flipper">
              <span class="card-face card-front" aria-hidden="true">
                <img src="images/card.png" alt="">
              </span>
              <span class="card-face card-back card-back-empty">nothing</span>
            </span>
          </button>
        </div>
        <div class="card-wrap">
          <button class="card-control" type="button" data-card-name="Nothing card" aria-label="Reveal Nothing card" aria-pressed="false">
            <span class="card-flipper">
              <span class="card-face card-front" aria-hidden="true">
                <img src="images/card.png" alt="">
              </span>
              <span class="card-face card-back card-back-empty">nothing</span>
            </span>
          </button>
        </div>
      </section>

    </main>
    <script src="javascript.js"></script>
  </body>
</html>
